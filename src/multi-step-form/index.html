<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Multi-step form</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/style/reset.css" />
    <link rel="stylesheet" href="./assets/style/typography.css" />
    <link rel="stylesheet" href="./assets/style/style.css" />
    <!-- JS -->
    <script type="module" src="./assets/scripts/index.js" defer></script>
  </head>
  <body>
    <main>
      <!-- SIDEBAR -->
      <aside class="step-indicator">
        <ol>
          <li aria-current="step" aria-label="Step 1 - Your info">
            <span class="step-count">Step 1</span>
            <span class="step-title">Your info</span>
          </li>
          <li aria-label="Step 2 - Select plan">
            <span class="step-count">Step 2</span>
            <span class="step-title">Select plan</span>
          </li>
          <li aria-label="Step 3 - Add-ons">
            <span class="step-count">Step 3</span>
            <span class="step-title">Add-ons</span>
          </li>
          <li aria-label="Step 4 - Summary">
            <span class="step-count">Step 4</span>
            <span class="step-title">Summary</span>
          </li>
        </ol>
      </aside>
      <!-- SIDEBAR END -->

      <article class="form-container">
        <!-- STEP 1 CONTENT -->
        <header id="step-1-form-header">
          <h1>Personal info</h1>
          <p>Please provide your name, email address, and phone number.</p>
        </header>
        <form id="step-1-form" novalidate>
          <div class="form-control">
            <div class="form-control__header">
              <label for="name">Name</label>
            </div>
            <input
              autofocus
              type="text"
              id="name"
              name="name"
              placeholder="e.g. Stephen King"
              pattern="^(\w{1,50}(\s|-)\w{1,50})+$"
              required
            />
          </div>

          <div class="form-control">
            <div class="form-control__header">
              <label for="email">Email Address</label>
            </div>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="e.g. stephenking@lorem.com"
              required
            />
          </div>

          <div class="form-control">
            <div class="form-control__header">
              <label for="phone">Phone Number</label>
            </div>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="e.g. +1 234 567 890"
              pattern="\+?(\d| |-){4,20}$"
              required
            />
          </div>
        </form>
        <!-- STEP 1 CONTENT END -->

        <footer>
          <button class="btn-ghost" type="button" hidden>Go Back</button>
          <button class="btn-primary" type="submit" form="step-1-form">
            Next Step
          </button>
        </footer>
      </article>

      <!-- Step 1 start 

      Name e.g. Stephen King Email Address e.g. stephenking@lorem.com Phone
      Number e.g. +1 234 567 890 Next Step

       Step 1 end -->

      <!-- Step 2 start 

      Select your plan You have the option of monthly or yearly billing. Arcade
      $9/mo Advanced $12/mo Pro $15/mo Monthly Yearly Go Back Next Step

       Step 2 end -->

      <!-- Step 3 start 

      Pick add-ons Add-ons help enhance your gaming experience. Online service
      Access to multiplayer games +$1/mo Larger storage Extra 1TB of cloud save
      +$2/mo Customizable Profile Custom theme on your profile +$2/mo Go Back
      Next Step

       Step 3 end -->

      <!-- Step 4 start 

      Finishing up Double-check everything looks OK before confirming.

       Dynamically add subscription and add-on selections here 

      Total (per month/year) Go Back Confirm

       Step 4 end -->

      <!-- Step 5 start 

      Thank you! Thanks for confirming your subscription! We hope you have fun
      using our platform. If you ever need support, please feel free to email us
      at support@loremgaming.com.

       Step 5 end -->

      <!-- <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/LukaJaredic">nobudev - Luka Jaredić</a>.
    </footer> -->
    </main>
  </body>
</html>
